<script>
  document.addEventListener("DOMContentLoaded", function() {
    const callouts = document.querySelectorAll('.callout-tip');
    callouts.forEach(function(callout) {
      callout.style.borderLeftColor = '#2196f3'; //#616161; //'#4caf50';
      callout.style.color = 'ffffff'; // Dark purple-gray text
    });
  });
</script>
